[project]
name = "policy-navigator-backend"
version = "0.1.0"
description = "FastAPI backend for the UNC Research Policy Navigator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "itsdangerous>=2.2", # signs the session cookie (Starlette SessionMiddleware)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.seed" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
# Thin command-line entry point; the seed logic it calls is tested.
omit = ["app/seed/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations always import sqlalchemy, even when unused.
"alembic/versions/*" = ["F401"]
